# Production Profile - PostgreSQL Database
spring.application.name=Employee Registry System
app.name=Employee Registry System
app.version=1.0.0

# Server Configuration
server.port=8080
server.servlet.context-path=/

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/nau_java_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging Configuration
logging.level.root=WARN
logging.level.ru.danila.NauJava=INFO
logging.level.org.springframework.security=WARN
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10

# Swagger/OpenAPI Configuration (disabled in production)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Actuator Configuration (restricted in production)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
