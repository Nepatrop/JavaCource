<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Система управления персоналом</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4a6cf7;
            --bg-color: #f8f9fc;
            --card-bg: #ffffff;
            --text-color: #333;
            --text-muted: #6c757d;
        }
        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-section {
            text-align: center;
            padding: 40px 20px;
        }
        .hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 20px;
        }
        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .btn-primary-custom {
            background: var(--primary-color);
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 500;
            border: none;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn-primary-custom:hover {
            background: #3a5bd9;
            color: white;
            transform: translateY(-2px);
        }
        .btn-outline-custom {
            background: transparent;
            color: var(--text-color);
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 500;
            border: 1px solid #dee2e6;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn-outline-custom:hover {
            background: var(--card-bg);
            color: var(--text-color);
            border-color: var(--primary-color);
        }
        .footer {
            background: var(--card-bg);
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<div class="main-content">
    <section class="hero-section">
        <h1 class="hero-title">Система управления персоналом</h1>
        <p class="hero-subtitle">Удобный инструмент для учёта сотрудников, отделов и формирования отчётов</p>
        <div class="d-flex justify-content-center gap-3 flex-wrap">
            <a href="/employees" class="btn-primary-custom">Перейти к работе</a>
            <a href="/register" class="btn-outline-custom">Регистрация</a>
        </div>
    </section>
</div>

<footer class="footer">
    <div class="container">
        NauJava HR System © 2025 — Итоговый проект по Java
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
