<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход - NauJava HR System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4a6cf7;
            --bg-color: #f8f9fc;
            --card-bg: #ffffff;
            --text-color: #333;
            --text-muted: #6c757d;
        }
        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .login-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 100%;
            padding: 40px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo {
            font-size: 2rem;
            margin-bottom: 12px;
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-color);
            margin: 0;
        }
        .login-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .form-label {
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 8px;
        }
        .form-control {
            border: 1px solid #dee2e6;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.1);
        }
        .btn-login {
            background: var(--primary-color);
            border: none;
            color: white;
            padding: 12px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            width: 100%;
            margin-top: 16px;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background: #3a5bd9;
            color: white;
        }
        .alert {
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: none;
        }
        .alert-danger {
            background: #fff5f5;
            color: #c53030;
        }
        .alert-success {
            background: #f0fff4;
            color: #276749;
        }
        .alert-info {
            background: #ebf8ff;
            color: #2b6cb0;
        }
        .login-footer {
            margin-top: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-header">
        <div class="login-logo"></div>
        <h1 class="login-title">Вход в систему</h1>
        <p class="login-subtitle">NauJava HR System — Управление персоналом</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        Неверный email или пароль
    </div>

    <div th:if="${param.success}" class="alert alert-success">
        Регистрация прошла успешно! Войдите в систему.
    </div>

    <div th:if="${param.logout}" class="alert alert-info">
        Вы вышли из системы
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" 
                   placeholder="Введите email" required autofocus>
        </div>
        
        <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="password" name="password" 
                   placeholder="Введите пароль" required>
        </div>
        
        <button type="submit" class="btn-login">Войти</button>
    </form>

    <div class="login-footer">
        Нет аккаунта? <a href="/register">Зарегистрироваться</a>
    </div>
    
    <a href="/" class="back-link">← На главную</a>
</div>
</body>
</html>
