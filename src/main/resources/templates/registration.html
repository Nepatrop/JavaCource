<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - NauJava HR System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4a6cf7;
            --bg-color: #f8f9fc;
            --card-bg: #ffffff;
            --text-color: #333;
            --text-muted: #6c757d;
        }
        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .register-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            padding: 40px;
        }
        .register-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .register-logo {
            font-size: 2rem;
            margin-bottom: 12px;
        }
        .register-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-color);
            margin: 0;
        }
        .register-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .form-label {
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 8px;
        }
        .form-control {
            border: 1px solid #dee2e6;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.1);
        }
        .btn-register {
            background: var(--primary-color);
            border: none;
            color: white;
            padding: 12px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            width: 100%;
            margin-top: 16px;
            transition: background 0.2s;
        }
        .btn-register:hover {
            background: #3a5bd9;
            color: white;
        }
        .alert {
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: none;
        }
        .alert-danger {
            background: #fff5f5;
            color: #c53030;
        }
        .register-footer {
            margin-top: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .register-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        .register-footer a:hover {
            text-decoration: underline;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: var(--primary-color);
        }
        .form-text {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<div class="register-card">
    <div class="register-header">
        <div class="register-logo"></div>
        <h1 class="register-title">Регистрация</h1>
        <p class="register-subtitle">Создайте аккаунт в NauJava HR System</p>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">
        Ошибка регистрации
    </div>

    <form action="/register" method="post">
        <div class="row">
            <div class="col-6 mb-3">
                <label for="firstName" class="form-label">Имя</label>
                <input type="text" class="form-control" id="firstName" name="firstName" 
                       placeholder="Иван" required autofocus minlength="2">
            </div>
            <div class="col-6 mb-3">
                <label for="lastName" class="form-label">Фамилия</label>
                <input type="text" class="form-control" id="lastName" name="lastName" 
                       placeholder="Иванов" required minlength="2">
            </div>
        </div>
        
        <div class="mb-3">
            <label for="username" class="form-label">Имя пользователя</label>
            <input type="text" class="form-control" id="username" name="username" 
                   placeholder="Введите логин" required minlength="3">
        </div>
        
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" 
                   placeholder="example@mail.com" required>
        </div>
        
        <div class="mb-3">
            <label for="departmentId" class="form-label">Отдел</label>
            <select class="form-control" id="departmentId" name="departmentId" required>
                <option value="" disabled selected>Выберите отдел</option>
                <option th:each="dept : ${departments}" th:value="${dept.m_id}" th:text="${dept.m_name}"></option>
            </select>
        </div>
        
        <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="password" name="password" 
                   placeholder="Минимум 6 символов" required minlength="6">
            <div class="form-text">Минимум 6 символов</div>
        </div>
        
        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" 
                   placeholder="Повторите пароль" required minlength="6">
        </div>
        
        <button type="submit" class="btn-register">Зарегистрироваться</button>
    </form>

    <div class="register-footer">
        Уже есть аккаунт? <a href="/login">Войти</a>
    </div>
    
    <a href="/" class="back-link">← На главную</a>
</div>
</body>
</html>
